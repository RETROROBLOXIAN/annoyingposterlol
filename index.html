<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="CSS/style.css">

<body>
    <header>
        <div class="nav-left">
            <a href="index.html">Home</a>
            <a href="coins.html">Coins</a>
            <a href="search.html">Search</a>
        </div>
        <div class="site-title">AnnoyingposterLOL</div>

    <main>
        <section id="new-post-section">
            <h2>Create New Post</h2>
            <button id="post-text-btn">Text Post</button>
            <button id="post-image-btn">Image Post</button>
            <button id="post-video-btn">Video Post</button>
            
            <div id="post-form" class="hidden">
                <input type="text" id="post-title" placeholder="Post Title">
                <textarea id="post-text" placeholder="What's on your mind?"></textarea>
                <input type="file" id="post-file">
                <button id="submit-post-btn">Post</button>
            </div>
        </section>

        <div class="posts-grid" id="posts-container"></div>
    </main>

    <script src="JS/main.js"></script>
    <script src="JS/posts.js"></script>
