<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AnnoyingposterLOL</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="icon" href="LOGO.ico" type="image/x-icon">
</head>
<body class="auth-page">
    <main>
        <div class="auth-container">
            <h2>Create Account</h2>
            <form id="signup-form">
                <div class="form-group">
                    <input type="text" id="signup-username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="email" id="signup-email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="text" id="signup-nickname" placeholder="Nickname" required>
                </div>
                <div class="form-group">
                    <input type="password" id="signup-password" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
                </div>
                <button type="submit">Create Account</button>
                <div id="signup-error" class="error hidden"></div>
            </form>
            <p class="text-center mt-20">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </main>

    <script src="JS/auth.js"></script>
</body>
</html>
