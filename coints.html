<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coins - AnnoyingPosterLOL</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="icon" href="LOGO.png" type="image/png">
</head>
<body>
    <header>
        <div class="header-left">
            <a href="index.html">Home</a>
            <a href="coins.html">Coins</a>
            <a href="search.html">Search</a>
        </div>
        <div class="header-right">
            <span class="coins-display" id="coins-display">0 AL</span>
            <a href="profile.html">Profile</a>
            <a href="settings.html">Settings</a>
            <a href="#" onclick="Storage.logout()">Logout</a>
        </div>
    </header>

    <main>
        <section>
            <h2>Your Coins: <span id="user-coins">0</span> AL</h2>
            
            <div class="coins-package">
                <h3>100 AL</h3>
                <p>$0.10</p>
                <button id="buy-100">Buy Now</button>
            </div>
            
            <div class="coins-package">
                <h3>1,000 AL</h3>
                <p>$1.00</p>
                <button id="buy-1000">Buy Now</button>
            </div>
            
            <div class="coins-package">
                <h3>5,000 AL</h3>
                <p>$5.00</p>
                <button id="buy-5000">Buy Now</button>
            </div>
            
            <div class="coins-package">
                <h3>10,000 AL</h3>
                <p>$10.00</p>
                <button id="buy-10000">Buy Now</button>
            </div>
            
            <div class="coins-package">
                <h3>100,000 AL</h3>
                <p>$100.00</p>
                <button id="buy-100000">Buy Now</button>
            </div>

            <div style="margin-top: 30px;">
                <h3>Convert Coins to Money</h3>
                <p>Minimum: 1,000 AL = $0.10</p>
                <button id="convert-coins">Convert Coins</button>
            </div>
        </section>
    </main>

    <script src="LOCALBASE/localstorage.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/coins.js"></script>
</body>
</html>
